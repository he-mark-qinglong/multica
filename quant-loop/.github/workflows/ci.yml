name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache pytest
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff check (changed files only)
        # Gate per docs/lint-baseline.md: pre-existing violations are
        # digested incrementally; new/changed .py files must be clean.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.py')
          if [ -z "$CHANGED" ]; then
            echo "no changed .py files; skipping ruff"
          else
            echo "$CHANGED" | xargs ruff check
          fi

      - name: Run tests
        run: python -m pytest _shared/ strategies/ --tb=short -q
